mode: "custom"
fontFamilies:
  - id: "zenmaru-body"
    family: "ZenMaruGothic-Medium"
    role: "body"
    source: "local"
    variants:
      - file: "src/assets/fonts/ZenMaruGothic-Medium.ttf"
        weight: 400
        style: "normal"
    fallback: ["ui-sans-serif", "system-ui", "sans-serif"]
    display: "swap"
    preload: false
  - id: "loli-cjk"
    family: "LoliFont"
    role: "cjk"
    source: "local"
    variants:
      - file: "src/assets/fonts/loli.ttf"
        weight: 500
        style: "normal"
    fallback: ["system-ui", "sans-serif"]
    display: "swap"
    preload: false
