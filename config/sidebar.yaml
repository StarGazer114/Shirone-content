# 侧栏编排（覆盖 src/config/sidebarConfig.ts 默认值）
# 注意：components 数组是整体替换，所以这里写的是完整列表，顺序即渲染顺序。
enable: true
arrangement: dual
side: left
components:
  - type: profile
    enable: true
    slot: top

  # 自定义链接卡片：站内入口放在资料卡下方
  - type: links
    enable: true
    slot: top
    title: 导航
    items:
      - name: 动态
        url: /moments/
        icon: material-symbols:auto-awesome-outline-rounded

  - type: music
    enable: true
    slot: top

  - type: announcement
    enable: true
    slot: top
    pages: [home]

  - type: categories
    enable: true
    slot: sticky
    collapseAfter: 5
    pages: [home, archive, friends, moments, anime, compass, skills, projects, devices, games, timeline, albums, about, post]

  - type: series
    enable: true
    slot: sticky
    collapseAfter: 5
    pages: [home, archive, friends, moments, anime, compass, skills, projects, devices, games, timeline, albums, about, post]

  - type: tags
    enable: true
    slot: sticky
    collapseAfter: 6
    pages: [home, archive, friends, moments, anime, compass, skills, projects, devices, games, timeline, albums, about, post]

  - type: stats
    enable: true
    slot: top
    column: secondary
    pages: [home, archive, categories, tags]

  - type: calendar
    enable: true
    slot: top
    column: secondary

  - type: toc
    enable: true
    slot: sticky
    column: secondary
    pages: [post]
