name: 申请友链
description: 提交友链申请，合并后会自动上线到 /friends/
title: "[友链] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        填写以下信息即可，**不需要打任何标签**。
        站点会定期从 Issue 自动生成到友链页；关闭本 Issue 即从友链中移除。

  - type: input
    id: sitename
    attributes:
      label: 站点名称
      placeholder: 你的博客名
    validations:
      required: true

  - type: input
    id: siteurl
    attributes:
      label: 站点链接
      placeholder: https://example.com
    validations:
      required: true

  - type: input
    id: avatar
    attributes:
      label: 头像链接
      placeholder: https://example.com/avatar.png
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 站点描述
      placeholder: 一句话介绍你的站点
    validations:
      required: false

  - type: input
    id: tags
    attributes:
      label: 标签（可选）
      description: 多个标签用逗号分隔，留空则不显示标签
      placeholder: 朋友们, 技术
    validations:
      required: false

  - type: checkboxes
    id: agree
    attributes:
      label: 确认
      options:
        - label: 我的站点可以正常访问，且内容合法
          required: true
