name: Deploy site

# 内容仓推送（或手动触发）时，调用 Cloudflare Pages 的 Deploy Hook 重新构建站点。
# 代码仓本身的推送由 Cloudflare Pages 的 Git 集成直接触发，无需经过这里。

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "data/**"
      - "config/**"
      - "assets/**"
      - "public/**"
  workflow_dispatch:

concurrency:
  group: deploy-hook
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Cloudflare Pages deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::warning::未配置 CF_DEPLOY_HOOK，跳过部署触发"
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 30 --request POST "$DEPLOY_HOOK"
          echo "已触发 Cloudflare Pages 构建"
