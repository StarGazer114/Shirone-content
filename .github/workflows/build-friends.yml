name: Build friends from issues

# 流程与原 firends-data 仓库一致：
#   Issue 创建 → 自动打「待审核」
#   打「审核通过」→ 生成进友链
#   打「审核拒绝」或关闭 Issue → 从友链移除
#   friends.ts 的 tags 字段不再自动填充默认分类，只取 Issue 表单里填写的标签

on:
  issues:
    types: [opened, labeled, unlabeled, edited, reopened, closed, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-friends
  cancel-in-progress: true

jobs:
  label-pending:
    name: Mark new issue as pending
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Add pending label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "待审核"

  build:
    name: Build friends data
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate data/friends.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUES_REPO: ${{ github.repository }}
          OUTPUT_FILE: data/friends.ts
          APPROVED_LABEL: "审核通过"
          REJECT_LABEL: "审核拒绝"
        run: node .github/scripts/build-friends.js

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/friends.ts
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "chore(friends): 从 Issue 更新友链数据"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Trigger Cloudflare Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::warning::未配置 CF_DEPLOY_HOOK，跳过部署触发"
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 30 --request POST "$DEPLOY_HOOK"
          echo "已触发 Cloudflare Pages 构建"
